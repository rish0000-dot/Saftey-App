<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>SafeLife AI - Emergency Response Prototype</title>
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- React & Router Global Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#0c0c1d",
                        "primary-container": "#00e3fd",
                        "primary-fixed-dim": "#00d4ec",
                        "on-primary-fixed": "#003840",
                        "surface-container-high": "#1d1d33",
                        "on-primary-container": "#004d57",
                        "on-error-container": "#ffa8a3",
                        "secondary-container": "#005ac2",
                        "tertiary-container": "#f53335",
                        "background": "#0c0c1d",
                        "on-secondary": "#001e4a",
                        "surface-container": "#18182b",
                        "on-primary-fixed-variant": "#005762",
                        "surface-container-lowest": "#000000",
                        "on-tertiary-fixed-variant": "#7a000b",
                        "surface-variant": "#24233b",
                        "on-secondary-fixed-variant": "#004da8",
                        "error-dim": "#d7383b",
                        "secondary": "#699cff",
                        "tertiary-fixed-dim": "#ff7b71",
                        "outline": "#757388",
                        "primary": "#81ecff",
                        "on-primary": "#005762",
                        "on-error": "#490006",
                        "inverse-on-surface": "#545366",
                        "secondary-fixed": "#bfd1ff",
                        "tertiary-dim": "#e2242a",
                        "tertiary": "#ff7168",
                        "outline-variant": "#474659",
                        "on-surface-variant": "#aba9bf",
                        "on-tertiary-container": "#000000",
                        "surface-bright": "#2a2a43",
                        "error-container": "#9f0519",
                        "on-background": "#e6e3fb",
                        "secondary-fixed-dim": "#a9c4ff",
                        "on-secondary-container": "#f7f7ff",
                        "inverse-surface": "#fcf8ff",
                        "surface-tint": "#81ecff",
                        "surface-container-highest": "#24233b",
                        "surface-container-low": "#121223",
                        "surface": "#0c0c1d",
                        "error": "#ff716c",
                        "on-tertiary-fixed": "#3a0002",
                        "secondary-dim": "#699cff",
                        "primary-fixed": "#00e3fd",
                        "inverse-primary": "#006976",
                        "on-surface": "#e6e3fb",
                        "on-secondary-fixed": "#003271",
                        "tertiary-fixed": "#ff9289",
                        "on-tertiary": "#4a0004",
                        "primary-dim": "#00d4ec"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            },
        }
    </script>

    <style>
        .alert-pulse {
            background: radial-gradient(circle, rgba(245, 51, 53, 0.15) 0%, rgba(12, 12, 29, 1) 70%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sos-3d-button {
            box-shadow: 
                -8px -8px 20px rgba(255, 113, 104, 0.1),
                8px 8px 25px rgba(0, 0, 0, 0.5),
                inset 2px 2px 5px rgba(255, 255, 255, 0.2),
                inset -2px -2px 5px rgba(0, 0, 0, 0.4);
        }
        .sos-glow {
            box-shadow: 0 0 50px rgba(0, 227, 253, 0.3), inset 0 0 20px rgba(0, 227, 253, 0.2);
        }
        .glass-card {
            backdrop-filter: blur(24px);
            background: rgba(36, 35, 59, 0.3);
        }
        .gradient-bg {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #0a0a1a 100%);
        }
        body {
            min-height: 100dvh;
            overflow-x: hidden;
            background-color: #0c0c1d;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim text-on-surface font-body selection:bg-tertiary/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Common Components ---

        const BottomNav = () => {
            const location = useLocation();
            const isAlert = location.pathname === '/alert';
            
            const navItems = [
                { icon: 'home', label: 'Home', path: '/' },
                { icon: 'group', label: 'Contacts', path: '/contacts' },
                { icon: 'history', label: 'History', path: '/history' },
                { icon: 'settings', label: 'Settings', path: '/settings' }
            ];

            return (
                <nav className="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 bg-[#121223]/40 backdrop-blur-2xl rounded-t-[2rem] border border-white/10 shadow-[0_-10px_40px_rgba(0,229,255,0.05)]">
                    {navItems.map((item) => {
                        const isActive = location.pathname === item.path;
                        return (
                            <Link 
                                key={item.label}
                                to={item.path} 
                                className={`flex flex-col items-center justify-center px-4 py-2 transition-all rounded-xl mt-2 ${isActive ? 'text-[#00E5FF] bg-[#00E5FF]/10 ring-1 ring-[#00E5FF]/30' : 'text-slate-500 hover:text-[#00E5FF]'}`}
                            >
                                <span className="material-symbols-outlined mb-1" style={{ fontVariationSettings: isActive ? "'FILL' 1" : "'FILL' 0" }}>{item.icon}</span>
                                <span className="font-headline text-[10px] uppercase tracking-[0.1em] font-bold">{item.label}</span>
                            </Link>
                        );
                    })}
                </nav>
            );
        };

        const Header = ({ isAlert }) => (
            <header className="fixed top-0 left-0 w-full z-[100] bg-transparent backdrop-blur-xl flex justify-between items-center px-6 py-4">
                <div className="flex items-center gap-2">
                    <span className="material-symbols-outlined text-[#00E5FF] drop-shadow-[0_0_8px_rgba(0,229,255,0.4)]" style={{ fontVariationSettings: "'FILL' 1" }}>shield_with_heart</span>
                    <h1 className="font-headline tracking-tighter text-xl font-bold text-[#00E5FF] drop-shadow-[0_0_8px_rgba(0,229,255,0.4)]">SafeLife AI</h1>
                </div>
                <div className="flex items-center gap-4">
                    {isAlert ? (
                        <div className="px-3 py-1 bg-tertiary-container/20 rounded-full flex items-center gap-2 border border-tertiary/30">
                            <span className="w-2 h-2 bg-tertiary rounded-full animate-pulse"></span>
                            <span className="font-label text-[10px] font-bold uppercase tracking-widest text-tertiary">Live GPS</span>
                        </div>
                    ) : (
                        <div className="flex items-center gap-2 px-3 py-1 rounded-full bg-on-secondary-container/10 border border-secondary/20">
                            <span className="w-2 h-2 rounded-full bg-[#00ff88] shadow-[0_0_8px_#00ff88]"></span>
                            <span className="font-label text-[10px] uppercase tracking-widest font-bold text-on-surface">Safe</span>
                        </div>
                    )}
                </div>
            </header>
        );

        // --- Screens ---

        const HomePage = () => {
            const navigate = useNavigate();
            const [isHolding, setIsHolding] = useState(false);
            const [progress, setProgress] = useState(0);

            // Simple mock for "Hold for SOS" logic
            useEffect(() => {
                let interval;
                if (isHolding) {
                    interval = setInterval(() => {
                        setProgress(prev => {
                            if (prev >= 100) {
                                navigate('/alert');
                                return 100;
                            }
                            return prev + 5;
                        });
                    }, 50);
                } else {
                    setProgress(0);
                }
                return () => clearInterval(interval);
            }, [isHolding, navigate]);

            return (
                <div className="gradient-bg min-h-screen text-on-surface">
                    <Header isAlert={false} />
                    <main className="relative pt-24 pb-40 px-6 max-w-lg mx-auto flex flex-col items-center justify-center min-h-screen">
                        
                        <div className="mb-8 glass-card border border-white/5 rounded-full px-6 py-2 flex items-center gap-3">
                            <span className="material-symbols-outlined text-[#00ff88]" style={{ fontVariationSettings: "'FILL' 1" }}>verified_user</span>
                            <span className="font-label text-xs font-bold tracking-[0.2em] uppercase text-on-surface/80">System Guardian Active</span>
                        </div>

                        <div className="relative w-72 h-72 flex items-center justify-center mb-12">
                            <div className="absolute inset-0 rounded-full border-2 border-primary/20 animate-ping opacity-20"></div>
                            <div className="absolute inset-4 rounded-full border border-primary/40 animate-pulse"></div>
                            
                            <button 
                                onMouseDown={() => setIsHolding(true)}
                                onMouseUp={() => setIsHolding(false)}
                                onTouchStart={() => setIsHolding(true)}
                                onTouchEnd={() => setIsHolding(false)}
                                className="relative group w-56 h-56 rounded-full p-2 bg-gradient-to-br from-surface-container-high to-surface-dim shadow-[0_0_60px_-15px_rgba(0,227,253,0.4)] transition-transform active:scale-90 duration-300 overflow-hidden"
                            >
                                <div 
                                    className="absolute bottom-0 left-0 w-full bg-primary/20 transition-all duration-75" 
                                    style={{ height: `${progress}%` }}
                                />
                                <div className="relative w-full h-full rounded-full bg-gradient-to-b from-[#121223] to-[#0c0c1d] flex flex-col items-center justify-center border-4 border-primary/10 group-hover:border-primary/40 transition-colors">
                                    <div className="absolute inset-2 rounded-full border border-[#00e3fd]/20 sos-glow"></div>
                                    <span className="material-symbols-outlined text-primary text-5xl mb-4" style={{ fontVariationSettings: "'FILL' 1" }}>fingerprint</span>
                                    <span className="font-headline font-bold text-lg tracking-widest text-primary">HOLD FOR SOS</span>
                                    <span className="font-label text-[9px] uppercase tracking-[0.3em] text-on-surface-variant mt-2">Emergency Response</span>
                                </div>
                            </button>
                        </div>

                        <div className="w-full glass-card border border-white/10 rounded-xl p-6 mb-8 relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-r from-transparent via-primary/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
                            <div className="flex items-start justify-between mb-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                        <span className="material-symbols-outlined" style={{ fontVariationSettings: "'FILL' 1" }}>location_on</span>
                                    </div>
                                    <div>
                                        <h3 className="font-headline font-bold text-on-surface">Live Location</h3>
                                        <p className="font-body text-xs text-on-surface-variant">San Francisco, CA</p>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <div className="text-[10px] font-label font-bold text-primary uppercase tracking-tighter">Signal Strength</div>
                                    <div className="flex gap-0.5 justify-end mt-1">
                                        <div className="w-1 h-3 bg-primary rounded-full"></div>
                                        <div className="w-1 h-3 bg-primary rounded-full"></div>
                                        <div className="w-1 h-3 bg-primary rounded-full"></div>
                                        <div className="w-1 h-3 bg-primary/30 rounded-full"></div>
                                    </div>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-surface-container-lowest/50 rounded-lg p-3 border border-white/5">
                                    <span className="font-label text-[9px] uppercase text-on-surface-variant block mb-1">Latitude</span>
                                    <span className="font-headline font-medium text-sm text-on-surface tracking-tight">37.7749° N</span>
                                </div>
                                <div className="bg-surface-container-lowest/50 rounded-lg p-3 border border-white/5">
                                    <span className="font-label text-[9px] uppercase text-on-surface-variant block mb-1">Longitude</span>
                                    <span className="font-headline font-medium text-sm text-on-surface tracking-tight">122.4194° W</span>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-4 gap-4 w-full">
                            {['call', 'mic', 'map', 'share'].map((icon) => (
                                <button key={icon} className="flex flex-col items-center gap-2 group">
                                    <div className="w-14 h-14 rounded-full glass-card border border-white/10 flex items-center justify-center text-on-surface-variant group-hover:text-primary group-hover:border-primary/40 transition-all shadow-lg active:scale-95">
                                        <span className="material-symbols-outlined">{icon}</span>
                                    </div>
                                    <span className="font-label text-[10px] uppercase tracking-wider font-bold capitalize">{icon === 'mic' ? 'Voice' : icon}</span>
                                </button>
                            ))}
                        </div>
                    </main>
                    
                    <div className="fixed top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px] pointer-events-none -z-10"></div>
                    <div className="fixed bottom-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-secondary/10 blur-[120px] pointer-events-none -z-10"></div>
                    <BottomNav />
                </div>
            );
        };

        const AlertPage = () => {
            const navigate = useNavigate();
            const [time, setTime] = useState(42);

            useEffect(() => {
                const timer = setInterval(() => {
                    setTime(t => t + 1);
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            return (
                <div className="bg-surface-dim text-on-surface min-h-screen">
                    <Header isAlert={true} />
                    <main className="relative pt-24 pb-32 px-6 flex flex-col items-center justify-center min-h-screen alert-pulse">
                        
                        <div className="mb-8 flex flex-col items-center text-center">
                            <div className="mb-4 inline-flex items-center gap-3 bg-tertiary/10 px-6 py-2 rounded-full border border-tertiary/20">
                                <span className="material-symbols-outlined text-tertiary" style={{ fontVariationSettings: "'FILL' 1" }}>warning</span>
                                <span className="font-headline font-bold text-tertiary tracking-widest">🚨 ALERT ACTIVE</span>
                            </div>
                            <div className="font-headline font-extrabold text-on-surface text-6xl md:text-8xl tracking-tighter mb-2">
                                {formatTime(time)}
                            </div>
                            <p className="font-label text-on-surface-variant uppercase tracking-[0.2em] text-xs">Sending live updates...</p>
                        </div>

                        <div className="relative group mb-12">
                            <div className="absolute inset-0 bg-tertiary/20 blur-[60px] rounded-full scale-110"></div>
                            <div className="absolute inset-0 bg-tertiary/10 blur-[100px] rounded-full scale-150 animate-pulse"></div>
                            
                            <button 
                                onClick={() => navigate('/')}
                                className="relative w-64 h-64 md:w-80 md:h-80 rounded-full bg-gradient-to-br from-tertiary to-tertiary-dim p-1 sos-3d-button flex flex-col items-center justify-center group active:scale-95 transition-transform duration-100"
                            >
                                <div className="w-full h-full rounded-full border-4 border-white/10 flex flex-col items-center justify-center gap-2">
                                    <span className="material-symbols-outlined text-6xl md:text-8xl text-white" style={{ fontVariationSettings: "'FILL' 1" }}>cancel</span>
                                    <span className="font-headline font-black text-2xl md:text-3xl text-white tracking-tighter">STOP ALERT</span>
                                </div>
                            </button>
                        </div>

                        <div className="w-full max-w-2xl grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div className="col-span-2 bg-surface-container-highest/30 backdrop-blur-2xl rounded-xl p-5 border border-white/5 flex flex-col justify-between">
                                <div>
                                    <span className="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Emergency Contacts</span>
                                    <h3 className="font-headline font-bold text-xl mt-1 text-on-surface">4 Alerted</h3>
                                </div>
                                <div className="flex -space-x-2 mt-4">
                                    <img alt="Avatar 1" className="w-8 h-8 rounded-full border-2 border-surface-dim" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTMdE2uBdYykD93Lv82oqe9vKEWnjpLnnWMal5KR74nf2419KDF_VsVEIEMy6gWOdJdgbnnK04ZfjrcH4hdBez9bRLWKK-1VSlEbnVP6_4pnY76SWY3hI6100GNkjc-5EpeZ6HmchgHQooFVLBuAcTlrK0Q07Yrw1n3jViz2Dj3Rq_wh28-BLjZrLw3WwtWSwg6Cgm6RktpNWrqICEup2b66yv49c6iZ9OCa5ZMtQu0G7sDbX4kYV_ME-s6yqoEGVnBB76Z6HxyCV9"/>
                                    <img alt="Avatar 2" className="w-8 h-8 rounded-full border-2 border-surface-dim" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAD6GHTTW-XDMxPBnHnMQaYyqOhaEN7LDaCT6pmilUtDccv4Gx7NIydge3IY4KF6mq2VkRu8LXP3ECLHdMp6eoMNlQ8qPq0Wy37NjzIIjGnA-0oJneaf7a6L_bcsKHz_F-SNUDRQQTbU61m-PM3bcY_ZZQtb49j8s6MlNePJQBws785MP3sM9-Mset0jp-PLGaZZh0MeEohKzeoaSsS5vjvIQdwmmHmgOiHZ1MlGAD5khcl-RlIqgGcY8ktbRsk-qmcHRcjFvTUJZTt"/>
                                    <img alt="Avatar 3" className="w-8 h-8 rounded-full border-2 border-surface-dim" src="https://lh3.googleusercontent.com/aida-public/AB6AXuATebY4YgnXvg5te8Kb00z-8OyynyDlA0LSl45JTdt85_KpQzgYN_NkPuuUKBAEeadqNKPL9tUZkQITETRU4XhqOeeqGFT1x1kvpO7aXnyClJA_ya0ULN1Lf-Ax5v9KPBa9LnO3P3hvrbe41nwoFchgrFwWJSi-GaeKxA8fj3O916IKy66oRV-4iEWtkiDpX6nFJTJFQqQLCYzZ6PiREhcmtMptqYr_fnjBVMK2AILsVt3aD2uzCQTu2-Ffgw088VsBCYdx_KC7f58Y"/>
                                    <div className="w-8 h-8 rounded-full bg-surface-container-high border-2 border-surface-dim flex items-center justify-center text-[10px] font-bold">+1</div>
                                </div>
                            </div>
                            
                            <div className="bg-surface-container-highest/30 backdrop-blur-2xl rounded-xl p-5 border border-white/5">
                                <span className="material-symbols-outlined text-primary mb-3">cell_tower</span>
                                <span className="block font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Signal</span>
                                <span className="font-headline font-bold text-lg text-primary">Strong</span>
                            </div>

                            <div className="bg-surface-container-highest/30 backdrop-blur-2xl rounded-xl p-5 border border-white/5">
                                <span className="material-symbols-outlined text-tertiary mb-3 animate-pulse" style={{ fontVariationSettings: "'FILL' 1" }}>mic</span>
                                <span className="block font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Audio</span>
                                <span className="font-headline font-bold text-lg text-on-surface">Rec...</span>
                            </div>

                            <div className="col-span-2 md:col-span-4 h-48 rounded-xl overflow-hidden relative border border-white/10">
                                <img alt="Live Map" className="w-full h-full object-cover grayscale contrast-125 opacity-40" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtYLKoYJpCmWiHNdRznthGgiDER1Fu7WcnkaO0Ky6d1XNJSgtkM7Vli95G4IE4W0aLnkuXO3trpufhpGlDrOHVNjFo2ocB4-22hdCgNOB0gLlhLr0BYyNpE6EzrtXG39L1Q4BoV3hJGtQf2XaubVuZq3ktssAOxi1bX2gmk29kWHHdbIuxJgrSt5Hp2rZY9DampKBS6pX9r1nRy3F9d8G2FTI0-O_cINcwHP_qYbo_yLgCm6m4jmLFZjV4QzXr4C-o-zXuZQ6RAiXI"/>
                                <div className="absolute inset-0 bg-gradient-to-t from-surface-dim via-transparent to-transparent"></div>
                                <div className="absolute bottom-4 left-4 right-4 flex justify-between items-end">
                                    <div>
                                        <p className="font-label text-[10px] uppercase tracking-widest text-on-surface-variant">Current Location</p>
                                        <p className="font-headline font-bold text-sm text-on-surface">37.7749° N, 122.4194° W</p>
                                    </div>
                                    <button className="bg-white/10 backdrop-blur-md px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 border border-white/10">
                                        <span className="material-symbols-outlined text-sm">open_in_full</span>
                                        MAP
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 text-center px-8">
                            <p className="text-[10px] font-label text-on-surface-variant uppercase tracking-wider leading-relaxed opacity-60">
                                Stopping this alert will notify your emergency contacts that you are safe. Emergency services may still be dispatched based on initial signal.
                            </p>
                        </div>
                    </main>
                    <BottomNav />
                </div>
            );
        };

        const SimplePlaceholder = ({ name }) => (
            <div className="gradient-bg min-h-screen text-on-surface">
                <Header isAlert={false} />
                <main className="relative pt-24 pb-40 px-6 max-w-lg mx-auto flex flex-col items-center justify-center min-h-screen">
                    <h2 className="font-headline text-3xl font-bold text-primary mb-4">{name}</h2>
                    <p className="text-on-surface-variant text-center">This section is part of the full application prototype experience.</p>
                </main>
                <BottomNav />
            </div>
        );

        // --- Main App Entry ---

        function App() {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/alert" element={<AlertPage />} />
                        <Route path="/contacts" element={<SimplePlaceholder name="Contacts" />} />
                        <Route path="/history" element={<SimplePlaceholder name="History" />} />
                        <Route path="/settings" element={<SimplePlaceholder name="Settings" />} />
                    </Routes>
                </MemoryRouter>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
