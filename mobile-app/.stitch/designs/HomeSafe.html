<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Manrope:wght@300;400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sos-glow {
            box-shadow: 0 0 50px rgba(0, 227, 253, 0.3), inset 0 0 20px rgba(0, 227, 253, 0.2);
        }
        .glass-card {
            backdrop-filter: blur(24px);
            background: rgba(36, 35, 59, 0.3);
        }
        body {
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #0a0a1a 100%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#0c0c1d",
                        "primary-container": "#00e3fd",
                        "primary-fixed-dim": "#00d4ec",
                        "on-primary-fixed": "#003840",
                        "surface-container-high": "#1d1d33",
                        "on-primary-container": "#004d57",
                        "on-error-container": "#ffa8a3",
                        "secondary-container": "#005ac2",
                        "tertiary-container": "#f53335",
                        "background": "#0c0c1d",
                        "on-secondary": "#001e4a",
                        "surface-container": "#18182b",
                        "on-primary-fixed-variant": "#005762",
                        "surface-container-lowest": "#000000",
                        "on-tertiary-fixed-variant": "#7a000b",
                        "surface-variant": "#24233b",
                        "on-secondary-fixed-variant": "#004da8",
                        "error-dim": "#d7383b",
                        "secondary": "#699cff",
                        "tertiary-fixed-dim": "#ff7b71",
                        "outline": "#757388",
                        "primary": "#81ecff",
                        "on-primary": "#005762",
                        "on-error": "#490006",
                        "inverse-on-surface": "#545366",
                        "secondary-fixed": "#bfd1ff",
                        "tertiary-dim": "#e2242a",
                        "tertiary": "#ff7168",
                        "outline-variant": "#474659",
                        "on-surface-variant": "#aba9bf",
                        "on-tertiary-container": "#000000",
                        "surface-bright": "#2a2a43",
                        "error-container": "#9f0519",
                        "on-background": "#e6e3fb",
                        "secondary-fixed-dim": "#a9c4ff",
                        "on-secondary-container": "#f7f7ff",
                        "inverse-surface": "#fcf8ff",
                        "surface-tint": "#81ecff",
                        "surface-container-highest": "#24233b",
                        "surface-container-low": "#121223",
                        "surface": "#0c0c1d",
                        "error": "#ff716c",
                        "on-tertiary-fixed": "#3a0002",
                        "secondary-dim": "#699cff",
                        "primary-fixed": "#00e3fd",
                        "inverse-primary": "#006976",
                        "on-surface": "#e6e3fb",
                        "on-secondary-fixed": "#003271",
                        "tertiary-fixed": "#ff9289",
                        "on-tertiary": "#4a0004",
                        "primary-dim": "#00d4ec"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Manrope"],
                        "label": ["Space Grotesk"]
                    }
                },
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface min-h-screen selection:bg-primary-container selection:text-on-primary-container overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-transparent backdrop-blur-xl fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00E5FF]" data-icon="shield_with_heart" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
<h1 class="font-['Space_Grotesk'] tracking-tight text-xl font-bold tracking-tighter text-[#00E5FF] drop-shadow-[0_0_8px_rgba(0,229,255,0.4)]">SafeLife AI</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-on-secondary-container/10 border border-secondary/20">
<span class="w-2 h-2 rounded-full bg-[#00ff88] shadow-[0_0_8px_#00ff88]"></span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold text-on-surface">Safe</span>
</div>
</div>
</header>
<main class="relative pt-24 pb-40 px-6 max-w-lg mx-auto flex flex-col items-center justify-center min-h-screen">
<!-- Status Indicator Pill -->
<div class="mb-8 glass-card border border-white/5 rounded-full px-6 py-2 flex items-center gap-3">
<span class="material-symbols-outlined text-[#00ff88]" data-icon="verified_user">verified_user</span>
<span class="font-label text-xs font-bold tracking-[0.2em] uppercase text-on-surface/80">System Guardian Active</span>
</div>
<!-- Central SOS Core -->
<div class="relative w-72 h-72 flex items-center justify-center mb-12">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border-2 border-primary/20 animate-ping opacity-20"></div>
<div class="absolute inset-4 rounded-full border border-primary/40 animate-pulse"></div>
<!-- Main Button Container -->
<button class="relative group w-56 h-56 rounded-full p-2 bg-gradient-to-br from-surface-container-high to-surface-dim shadow-[0_0_60px_-15px_rgba(0,227,253,0.4)] transition-transform active:scale-90 duration-300">
<div class="w-full h-full rounded-full bg-gradient-to-b from-[#121223] to-[#0c0c1d] flex flex-col items-center justify-center border-4 border-primary/10 group-hover:border-primary/40 transition-colors">
<!-- Glow Inner Ring -->
<div class="absolute inset-2 rounded-full border border-[#00e3fd]/20 sos-glow"></div>
<span class="material-symbols-outlined text-primary text-5xl mb-4" data-icon="fingerprint" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
<span class="font-headline font-bold text-lg tracking-widest text-primary">HOLD FOR SOS</span>
<span class="font-label text-[9px] uppercase tracking-[0.3em] text-on-surface-variant mt-2">Emergency Response</span>
</div>
</button>
</div>
<!-- Live Location Card -->
<div class="w-full glass-card border border-white/10 rounded-xl p-6 mb-8 relative overflow-hidden group">
<!-- Shimmer Effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/5 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
<div class="flex items-start justify-between mb-4">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<h3 class="font-headline font-bold text-on-surface">Live Location</h3>
<p class="font-body text-xs text-on-surface-variant">San Francisco, CA</p>
</div>
</div>
<div class="text-right">
<div class="text-[10px] font-label font-bold text-primary uppercase tracking-tighter">Signal Strength</div>
<div class="flex gap-0.5 justify-end mt-1">
<div class="w-1 h-3 bg-primary rounded-full"></div>
<div class="w-1 h-3 bg-primary rounded-full"></div>
<div class="w-1 h-3 bg-primary rounded-full"></div>
<div class="w-1 h-3 bg-primary/30 rounded-full"></div>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-lowest/50 rounded-lg p-3 border border-white/5">
<span class="font-label text-[9px] uppercase text-on-surface-variant block mb-1">Latitude</span>
<span class="font-headline font-medium text-sm text-on-surface tracking-tight">37.7749° N</span>
</div>
<div class="bg-surface-container-lowest/50 rounded-lg p-3 border border-white/5">
<span class="font-label text-[9px] uppercase text-on-surface-variant block mb-1">Longitude</span>
<span class="font-headline font-medium text-sm text-on-surface tracking-tight">122.4194° W</span>
</div>
</div>
</div>
<!-- Quick Action Floating Grid -->
<div class="grid grid-cols-4 gap-4 w-full">
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full glass-card border border-white/10 flex items-center justify-center text-on-surface-variant group-hover:text-primary group-hover:border-primary/40 transition-all shadow-lg active:scale-95">
<span class="material-symbols-outlined" data-icon="call">call</span>
</div>
<span class="font-label text-[10px] uppercase tracking-wider font-bold">Call</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full glass-card border border-white/10 flex items-center justify-center text-on-surface-variant group-hover:text-primary group-hover:border-primary/40 transition-all shadow-lg active:scale-95">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</div>
<span class="font-label text-[10px] uppercase tracking-wider font-bold">Voice</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full glass-card border border-white/10 flex items-center justify-center text-on-surface-variant group-hover:text-primary group-hover:border-primary/40 transition-all shadow-lg active:scale-95">
<span class="material-symbols-outlined" data-icon="map">map</span>
</div>
<span class="font-label text-[10px] uppercase tracking-wider font-bold">Map</span>
</button>
<button class="flex flex-col items-center gap-2 group">
<div class="w-14 h-14 rounded-full glass-card border border-white/10 flex items-center justify-center text-on-surface-variant group-hover:text-primary group-hover:border-primary/40 transition-all shadow-lg active:scale-95">
<span class="material-symbols-outlined" data-icon="share">share</span>
</div>
<span class="font-label text-[10px] uppercase tracking-wider font-bold">Share</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 bg-[#121223]/40 backdrop-blur-2xl docked rounded-t-[2rem] mx-4 mb-6 border border-white/10 shadow-[0_-10px_40px_rgba(0,229,255,0.05)]">
<a class="flex flex-col items-center justify-center text-[#00E5FF] bg-[#00E5FF]/10 rounded-xl px-4 py-2 ring-1 ring-[#00E5FF]/30" href="#">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-[0.1em] font-bold mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:text-[#00E5FF] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-[0.1em] font-bold mt-1">Contacts</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:text-[#00E5FF] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-[0.1em] font-bold mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 px-4 py-2 hover:text-[#00E5FF] transition-all" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Space_Grotesk'] text-[10px] uppercase tracking-[0.1em] font-bold mt-1">Settings</span>
</a>
</nav>
<!-- Decorative Gradient Blurs -->
<div class="fixed top-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-secondary/10 blur-[120px] pointer-events-none -z-10"></div>
</body></html>
